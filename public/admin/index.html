<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel UMJIU</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="login" id="login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <img src="/img/logo.png" alt="UMJIU" width="392" height="179">
    <h1>Painel administrativo</h1>
    <label class="f">E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label class="f">Senha<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" id="login-err" role="alert" hidden></p>
    <button class="b b-primary" type="submit">Entrar</button>
    <a class="back" href="/">&larr; Voltar ao site</a>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <a class="side-logo" href="#painel"><img src="/img/logo-claro.png" alt="UMJIU" width="392" height="179"></a>
    <nav id="side-nav" aria-label="Painel"></nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener">Ver o site &nearr;</a>
      <button id="logout">Sair</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="drawer-bg" id="drawer-bg" hidden>
  <form class="drawer" id="drawer" novalidate>
    <header><h2 id="drawer-title"></h2><button type="button" class="x" data-act="drawer-close" aria-label="Fechar">&times;</button></header>
    <div class="drawer-body" id="drawer-body"></div>
    <footer><p class="err" id="drawer-err" role="alert" hidden></p>
      <button type="button" class="b" data-act="drawer-close">Cancelar</button>
      <button type="submit" class="b b-primary" id="drawer-save">Salvar</button></footer>
  </form>
</div>

<dialog class="confirm" id="confirm">
  <p id="confirm-msg"></p>
  <div><button class="b" value="no" id="confirm-no">Cancelar</button><button class="b b-danger" id="confirm-yes">Excluir</button></div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/admin/admin.js" defer></script>
</body>
</html>
